name: CI

on:
  push:
    branches: [ main, master, worktree-bug_survival_rpg ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      # Lua/Luau environment not needed for rbxmk; we just ensure Rojo is available
      - name: Install Rojo
        run: |
          curl -L -o rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip
          mkdir -p ${{ runner.temp }}/rojo
          unzip -q rojo.zip -d ${{ runner.temp }}/rojo
          echo "${{ runner.temp }}/rojo" >> $GITHUB_PATH
      - name: Install TestEZ
        run: |
          git clone https://github.com/roblox/testez.git TestEZ
      - name: Install rbxmk
        run: |
          curl -L -o rbxmk.exe https://github.com/rojo-rbx/rbxmk/releases/download/v0.15.1/rbxmk-windows-x86_64.exe
          chmod +x rbxmk.exe
      - name: Run Tests with rbxmk
        run: |
          ./rbxmk.exe test src/**/*.test.lua
