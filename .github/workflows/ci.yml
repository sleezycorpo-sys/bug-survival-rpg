name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Rojo
        run: |
          curl -L -o rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip
          mkdir -p ${{ runner.temp }}/rojo
          unzip -q rojo.zip -d ${{ runner.temp }}/rojo
          echo "${{ runner.temp }}/rojo" >> $GITHUB_PATH
      - name: Run tests (placeholder)
        run: echo "Tests would run here with Rojo and TestEZ"
