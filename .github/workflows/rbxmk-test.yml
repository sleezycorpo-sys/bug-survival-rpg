name: Run rbxmk Test Suite

on:
  push:
    branches: [ master, main, develop, worktree-bug_survival_rpg ]
  pull_request:
    branches: [ master, main, develop, worktree-bug_survival_rpg ]
  workflow_dispatch:   # enables manual trigger from the UI

jobs:
  test:
    runs-on: ubuntu-latest   # use Linux runner – rbxmk has a Linux binary
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # get full history (optional)

      # -------------------------------------------------------
      # 1️⃣ Download the Linux binary for rbxmk
      # -------------------------------------------------------
      - name: Download rbxmk (Linux binary)
        run: |
          set -e
          url="https://github.com/Anaminus/rbxmk/releases/download/v0.15.1/rbxmk-linux-x86_64"
          echo "Downloading rbxmk from $url"
          curl -L -o rbxmk "$url"
          chmod +x rbxmk

      # -------------------------------------------------------
      # 2️⃣ (Optional) Verify checksum – helps ensure a clean download
      # -------------------------------------------------------
      - name: Verify rbxmk integrity (optional)
        run: |
          echo "Computing SHA256 checksum..."
          sha256sum rbxmk | awk '{print $1}'

      # -------------------------------------------------------
      # 3️⃣ Run the TestEZ suite with rbxmk
      # -------------------------------------------------------
      - name: Run TestEZ tests
        run: ./rbxmk test src/**/*.test.lua
