name: Run rbxmk Test Suite

on:
  push:
    branches: [ master, main, develop, worktree-bug_survival_rpg ]
  pull_request:
    branches: [ master, main, develop, worktree-bug_survival_rpg ]
  workflow_dispatch:   # enables manual trigger from the UI

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh        # default PowerShell for most steps

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # get full history (optional)

      # -------------------------------------------------------
      # 1️⃣ Download the exact Windows binary for rbxmk using curl (works on windows runners)
      # -------------------------------------------------------
      - name: Download rbxmk.exe (Windows binary)
        shell: bash
        run: |
          set -e
          url="https://github.com/Anaminus/rbxmk/releases/download/v0.15.1/rbxmk-windows-x86_64.exe"
          echo "Downloading rbxmk from $url"
          curl -L -o rbxmk.exe "$url"
          # Ensure the file is not marked as blocked on Windows
          chmod +x rbxmk.exe
          # Switch back to PowerShell for the next steps (the file will be in the workspace)

      # -------------------------------------------------------
      # 2️⃣ (Optional) Verify checksum – helps ensure a clean download
      # -------------------------------------------------------
      - name: Verify rbxmk.exe integrity (optional)
        run: |
          Write-Host "Computing SHA256 checksum..."
          $hash = Get-FileHash .\rbxmk.exe -Algorithm SHA256
          Write-Host "SHA256: $($hash.Hash)"
          # Unblock the file in case Windows marks it as blocked
          Unblock-File -Path .\rbxmk.exe

      # -------------------------------------------------------
      # 3️⃣ Run the TestEZ suite with rbxmk
      # -------------------------------------------------------
      - name: Run TestEZ tests
        run: .\rbxmk.exe test src/**/*.test.lua