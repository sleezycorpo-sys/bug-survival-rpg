name: Run rbxmk Test Suite

on:
  push:
    branches: [ master, main, develop, worktree-bug_survival_rpg ]
  pull_request:
    branches: [ master, main, develop, worktree-bug_survival_rpg ]
  workflow_dispatch:   # enables manual trigger from the UI

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh        # use PowerShell for all steps

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # get full history (optional)

      # -------------------------------------------------------
      # 1️⃣ Download the correct Windows binary for rbxmk
      # -------------------------------------------------------
      - name: Download rbxmk.exe (Windows binary)
        run: |
          $url = "https://github.com/Anaminus/rbxmk/releases/download/v0.15.1/rbxmk-windows-x86_64.exe"
          $out = "$PSScriptRoot\rbxmk.exe"
          Write-Host "Downloading rbxmk from $url ..."
          Invoke-WebRequest -Uri $url -OutFile $out
          # Remove Windows "blocked" flag that can appear on downloaded executables
          Unblock-File -Path $out

      # -------------------------------------------------------
      # 2️⃣ (Optional) Verify checksum – helps ensure a clean download
      # -------------------------------------------------------
      - name: Verify rbxmk.exe integrity (optional)
        run: |
          Write-Host "Computing SHA256 checksum..."
          $hash = Get-FileHash rbxmk.exe -Algorithm SHA256
          Write-Host "SHA256: $($hash.Hash)"

      # -------------------------------------------------------
      # 3️⃣ Run the TestEZ suite with rbxmk
      # -------------------------------------------------------
      - name: Run TestEZ tests
        run: .\rbxmk.exe test src/**/*.test.lua