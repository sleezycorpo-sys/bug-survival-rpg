name: Run rbxmk Test Suite

on:
  push:
    branches: [ master, main, develop, worktree-bug_survival_rpg ]
  pull_request:
    branches: [ master, main, develop, worktree-bug_survival_rpg ]
  workflow_dispatch:   # enables manual trigger from the UI

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # get the whole history (optional)

      - name: Download rbxmk.exe (Windows binary) if missing
        run: |
          if (-Not (Test-Path .\rbxmk.exe)) {
            Write-Host "Downloading rbxmk.exe for Windows..."
            Invoke-WebRequest -Uri "https://github.com/rojo-rbx/rbxmk/releases/download/v0.15.1/rbxmk-windows-x86_64.exe" -OutFile rbxmk.exe
          }

      - name: Verify rbxmk.exe integrity
        run: |
          Write-Host "Checking rbxmk.exe checksum (optional)…"
          certutil -hashfile rbxmk.exe SHA256 | Out-Null

      - name: Run TestEZ tests
        run: .\\rbxmk.exe test src/**/*.test.lua