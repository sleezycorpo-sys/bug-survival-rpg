name: Run rbxmk Test Suite

  # Lets you start the workflow manually from the GitHub UI
  workflow_dispatch:

  on:
    push:
      branches: [ master, main, develop, worktree-bug_survival_rpg ]
    pull_request:
      branches: [ master, main, develop, worktree-bug_survival_rpg ]

  jobs:
    test:
      runs-on: windows-latest
      defaults:
        run:
          shell: pwsh

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
          with:
            fetch-depth: 0   # get the full history (optional)

        - name: Verify rbxmk.exe integrity
          run: |
            Write-Host "Checking rbxmk.exe checksum (optional)…"
            certutil -hashfile rbxmk.exe SHA256 | Out-Null

        - name: Run TestEZ tests
          run: .\rbxmk.exe test src/**/*.test.lua
