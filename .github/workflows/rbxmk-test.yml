name: Run rbxmk Test Suite

on:
  push:
    branches: [ master, main, develop, worktree-bug_survival_rpg ]
  pull_request:
    branches: [ master, main, develop, worktree-bug_survival_rpg ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Download Linux binary zip for rbxmk (v0.9.1)
      - name: Download rbxmk Linux zip
        run: |
          set -e
          url="https://github.com/Anaminus/rbxmk/releases/download/v0.9.1/rbxmk-linux-amd64.zip"
          echo "Downloading rbxmk from $url"
          curl -L -o rbxmk.zip "$url"
          unzip rbxmk.zip -d rbxmk_dir
          chmod +x rbxmk_dir/rbxmk

      # Optional checksum (display)
      - name: Show checksum of rbxmk binary
        run: |
          sha256sum rbxmk_dir/rbxmk

      - name: Run TestEZ tests
        run: ./rbxmk_dir/rbxmk test src/**/*.test.lua